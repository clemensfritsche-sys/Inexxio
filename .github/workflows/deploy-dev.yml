name: Deploy → Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    with:
      build: false          # gebaut wird einmal, im Deploy (Job «Build»), vor dem Ausrollen

  deploy:
    name: Dev
    needs: quality
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      env_name: dev
      gcp_project: inexxio-dev
      service: inexxio-backend-dev
      sql_instance: inexxio-dev-db
      site_url: https://inexxio-dev.web.app
      app_env: development
      # Auf null im Leerlauf (~0 CHF); der erste Aufruf danach wartet einen Kaltstart.
      # Verbindungen: 2 Instanzen × 1 Worker × (5 + 5) = 20 ≤ 25 − 3 (db-f1-micro).
      min_instances: 0
      max_instances: 2
      cpu: '1'
      memory: 512Mi
      web_workers: 1
      # FIREBASE_PROJECT_ID kommt auf dev aus dem Secret Manager (Eingabe leer).
      stripe_publishable_key: pk_test_51TnjWgQr3aoUqi8iUdnZrLl9X5CvfjtUXwfKHQrXtnUEEYtMKnU74R5gGxGg0otY0GTSZZQLQLBZ1LYse95ICcO700e1hcSnsn
      site_env: dev
      site_feedback: 'on'
      next_environment: development
      noindex: true
      firebase_api_key: AIzaSyCl0x8TQUWX5XaECVF2luO9i9PNU8L7CWE
      firebase_auth_domain: inexxio-dev.firebaseapp.com
      firebase_storage_bucket: inexxio-dev.firebasestorage.app
      firebase_messaging_sender_id: '395883203074'
      firebase_app_id: 1:395883203074:web:806fcb48ad21b90c88751b
      # Workload Identity (infra/README.md): kein Geheimnis, Google nimmt das Token nur
      # für dieses Repository an.
      workload_identity_provider: projects/395883203074/locations/global/workloadIdentityPools/github/providers/github
      service_account: github-actions@inexxio-dev.iam.gserviceaccount.com

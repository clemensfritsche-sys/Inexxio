name: Deploy → Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  GCP_PROJECT: inexxio-dev
  GCP_REGION: europe-west6
  ARTIFACT_REGISTRY: europe-west6-docker.pkg.dev
  ARTIFACT_REPO: inexxio-dev
  CLOUD_RUN_SERVICE: inexxio-backend-dev
  FIREBASE_PROJECT: inexxio-dev

jobs:
  # Prüfungen: .github/workflows/quality.yml (dasselbe Gate wie beim Prod-Deploy).
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml

  deploy-backend:
    name: Backend → Cloud Run (dev)
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and push backend image
        id: build
        working-directory: backend
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/backend:latest"
          docker build --tag "$IMAGE" --tag "$IMAGE_LATEST" \
            --cache-from "$IMAGE_LATEST" --build-arg BUILDKIT_INLINE_CACHE=1 .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ►►► **Der dritte Stripe-Schlüssel steht offen in der Zeile — mit Absicht.** ◄◄◄
      #
      # `STRIPE_PUBLISHABLE_KEY` rendert das Zahlungsformular im Browser; ohne ihn ist
      # `payment_service_ready()` falsch, und der Bezahlen-Knopf erscheint gar nicht erst
      # (`voucher.can` führt `pay_online` dann nicht).
      #
      # Er steht in `--set-env-vars`, NICHT in `--set-secrets`: er ist **kein Geheimnis**
      # – er steht im Browser jedes Zahlenden, wie `NEXT_PUBLIC_FIREBASE_API_KEY` weiter
      # unten. Ihn wie eines zu behandeln kostet zwei `gcloud`-Befehle und eine
      # IAM-Bindung und schützt nichts. Der geheime Schlüssel und das Webhook-Secret
      # bleiben im Secret Manager – dort gehören sie hin.
      #
      # Ein `pk_test_…` gilt nur für die Sandbox; für die Produktion tritt der
      # `pk_live_…` derselben Zeile an seine Stelle (`docs/stripe-setup.md` §5).
      # ►►► **Die Gmail-Anbindung und die KI sind OPTIONAL** (`docs/gmail-setup.md`, `docs/dokumente.md`). ◄◄◄ Ihre
      # Secrets werden nur eingebunden, wenn es sie im Secret Manager gibt – vorher würde
      # `--set-secrets` den ganzen Deploy abbrechen. Ohne sie wird eine Mail nur erfasst.
      - name: Optionale Secrets (Gmail, KI)
        id: optsec
        run: |
          extra=""
          for s in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ANTHROPIC_API_KEY; do
            # `versions access` statt `describe`: die Rolle «Zugriffsperson für Secret
            # Manager-Secret» des Deploy-Kontos erlaubt genau das, `describe` nicht.
            if gcloud secrets versions access latest --secret "$s" --project "${{ env.GCP_PROJECT }}" >/dev/null 2>&1; then
              echo "Secret $s gefunden – wird eingebunden"
              extra="$extra,$s=$s:latest"
            else
              echo "Secret $s fehlt oder ist nicht lesbar – dieser Dienst bleibt aus"
            fi
          done
          echo "extra=$extra" >> "$GITHUB_OUTPUT"

      # ►►► **Die Datei-Ablage** – je Umgebung ein eigener Bucket `<Projekt>-files` (privat,
      # europe-west6), einmal von Hand angelegt (`docs/dokumente.md`). ◄◄◄ Fehlt er oder ist er
      # nicht schreibbar, bleiben die Dateien in der Datenbank (`services/attachments`).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ steps.build.outputs.image }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "cloudrun-backend@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:inexxio-dev-db" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest${{ steps.optsec.outputs.extra }}" \
            --set-env-vars "APP_ENV=development,FRONTEND_BASE_URL=https://inexxio-dev.web.app,STRIPE_PUBLISHABLE_KEY=pk_test_51TnjWgQr3aoUqi8iUdnZrLl9X5CvfjtUXwfKHQrXtnUEEYtMKnU74R5gGxGg0otY0GTSZZQLQLBZ1LYse95ICcO700e1hcSnsn,FILES_BUCKET=${{ env.GCP_PROJECT }}-files" \
            --min-instances 1 \
            --max-instances 3 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120s \
            --concurrency 80 \
            --quiet

  deploy-frontend:
    name: Frontend → Firebase Hosting (dev)
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Die Website zuerst – mit Node 22 (Astro 7 verlangt ≥ 22.12). Danach läuft alles Weitere
      # unverändert mit Node 20, auch die Firebase-CLI: so wechselt kein bestehender Schritt
      # seine Node-Version. Zusammengeführt wird erst nach dem ERP-Build (siehe unten).
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website (Vorschau)
        working-directory: website
        env:
          SITE_MODE: preview
          SITE_URL: https://inexxio-dev.web.app
          # Testnotizen auch auf der Website (nur hier, nur für Angemeldete).
          SITE_FEEDBACK: 'on'
          # «DEV»-Kennzeichen im Kopf (Website und – über den gemeinsamen Kopf – Konto/ERP).
          # Nur hier gesetzt; der Prod-Deploy kennt die Variable nicht.
          SITE_ENV: dev
          # Telefon und E-Mail als Vorgabe ins HTML – aus dem ERP (Testnotiz #1094).
          SITE_API: https://inexxio-dev.web.app
        run: npm run build

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Install Firebase CLI
        # Fest eingestellt: 15.34.1 (21.10.2026) verlangt beim Deploy zusätzlich das Recht
        # serviceusage.services.get, das der Deploy-Account nicht hat (403). Erhöhen nur bewusst.
        run: npm install -g firebase-tools@15.34.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCl0x8TQUWX5XaECVF2luO9i9PNU8L7CWE
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: inexxio-dev.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: inexxio-dev
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: inexxio-dev.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "395883203074"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:395883203074:web:806fcb48ad21b90c88751b
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-9D74JS9VN8
          NEXT_PUBLIC_API_URL: https://inexxio-dev.web.app
          NEXT_PUBLIC_APP_URL: https://inexxio-dev.web.app
          NEXT_PUBLIC_ENVIRONMENT: development
          # Build-Commit: beantwortet bei einer Testnotiz «welchen Stand hast du gesehen?»
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          # Kopf und Fuss sind die der Website (oben gebaut) – ohne sie wird nicht ausgeliefert.
          SHELL_REQUIRED: "1"
        run: npm run build

      # Die Website kommt in DIESELBE Hosting-Ausgabe: sie besitzt «/» und ihre Seiten,
      # das ERP behält /erp, /konto, /login, /agb. Der Merge bricht bei jeder Kollision ab.
      - name: Website in die Hosting-Ausgabe übernehmen
        working-directory: website
        run: node scripts/merge-hosting.mjs

      # ►►► Dev wird nie indexiert – per HTTP-Kopfzeile auf JEDER Antwort. ◄◄◄
      # Gilt für Website, Konto, ERP, Bilder und PDFs gleichermassen und hängt nicht an der
      # Website (SITE_MODE). Nur hier gesetzt: der Prod-Deploy liest dieselbe firebase.json
      # ohne diese Zeile. Fehlt sie danach, bricht der Schritt ab, statt still zu indexieren.
      - name: Dev für Suchmaschinen sperren (X-Robots-Tag)
        run: |
          jq '(.hosting.headers[] | select(.source == "**") | .headers) += [{"key": "X-Robots-Tag", "value": "noindex, nofollow, noarchive"}]' firebase.json > firebase.dev.json
          mv firebase.dev.json firebase.json
          jq -e '[.hosting.headers[] | select(.source == "**") | .headers[] | select(.key == "X-Robots-Tag")] | length == 1' firebase.json

      - name: Deploy to Firebase Hosting (dev)
        run: firebase deploy --only hosting --project inexxio-dev --non-interactive

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: failure()
    steps:
      - run: echo "::error::Dev deployment failed for ${{ github.sha }} by ${{ github.actor }}"

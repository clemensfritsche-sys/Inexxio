name: Deploy → Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  GCP_PROJECT: inexxio-dev
  GCP_REGION: europe-west6
  ARTIFACT_REGISTRY: europe-west6-docker.pkg.dev
  ARTIFACT_REPO: inexxio-dev
  CLOUD_RUN_SERVICE: inexxio-backend-dev
  FIREBASE_PROJECT: inexxio-dev

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # Postgres nur für den Schema-Aufbau: die Migrationen sind laut Leitbild die EINE
    # Schema-Wahrheit – geprüft wird das erst, wenn sie auch wirklich von null durchlaufen.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      # Baut das Schema von NULL aus den Migrationen auf. Klingt selbstverständlich, war es
      # aber nicht: eine Datenreparatur (074) griff auf eine Spalte zu, die nie eine
      # Migration angelegt hatte (sie stammte aus dem Lifespan-``create_all`` und wurde von
      # 081 wieder entfernt) – auf einer frischen Datenbank brach der Aufbau dort ab. Die
      # laufende Umgebung merkt davon nichts, ein neues Projekt oder eine Wiederherstellung
      # aus dem Nichts scheitert. Dieselbe Ausfallklasse wie beim Deploy von Migration 090:
      # es zeigt sich erst, wenn es zählt.
      - name: Schema aus den Migrationen aufbauen (Alembic ist die Wahrheit)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: alembic upgrade head

      # ERST das Schema, DANN die Tests: die Invarianten des Prozessbildes
      # (tests/test_flow_graph.py) brauchen echtes PostgreSQL – JSONB-Payloads und der
      # partielle Unique-Index auf ``order_units`` sind genau das, was sie prüfen.
      # Ohne DATABASE_URL überspringen sie sich lautlos, und ein Wächter, der nie
      # anschlägt, ist von einem kaputten nicht zu unterscheiden.
      #
      # Mitgefahren werden dabei die **Szenariomatrix** (tests/test_scenarios.py, Soll je
      # Fall in tests/matrix.py) und die **systemweiten Invarianten**
      # (tests/test_invariants.py → app/services/invariants.py). Sie sind das Ergebnis
      # der Testkampagne (TEST_REPORT.md) und ersetzen die mit dem Basis-Neuaufbau
      # entfallene Regel-Tabelle – als geschriebene, überprüfbare Regel statt als Prosa.
      - name: pytest (Matrix + Invarianten + Wächter)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests/ -v --tb=short

      # Der Schema-Aufbau von null darüber bleibt: er hat schon einmal einen Fehler
      # gefunden, den die laufende Umgebung nicht zeigt.

      - name: Check generated types are up to date
        run: |
          (cd backend && python -m scripts.dump_openapi)
          (cd backend && python -m scripts.dump_statuses)
          (cd frontend && npm run generate:types)
          git diff --exit-code backend/openapi.json frontend/src/types/api.ts frontend/src/lib/status-catalog.ts || \
            (echo "::error::Generierte Dateien sind veraltet — 'python -m scripts.dump_openapi', 'python -m scripts.dump_statuses' und 'npm run generate:types' ausführen und committen" && exit 1)

  deploy-backend:
    name: Backend → Cloud Run (dev)
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and push backend image
        id: build
        working-directory: backend
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/backend:latest"
          docker build --tag "$IMAGE" --tag "$IMAGE_LATEST" \
            --cache-from "$IMAGE_LATEST" --build-arg BUILDKIT_INLINE_CACHE=1 .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ steps.build.outputs.image }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "cloudrun-backend@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:inexxio-dev-db" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest" \
            --set-env-vars "APP_ENV=development,FRONTEND_BASE_URL=https://inexxio-dev.web.app" \
            --min-instances 1 \
            --max-instances 3 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120s \
            --concurrency 80 \
            --quiet

  deploy-frontend:
    name: Frontend → Firebase Hosting (dev)
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCl0x8TQUWX5XaECVF2luO9i9PNU8L7CWE
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: inexxio-dev.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: inexxio-dev
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: inexxio-dev.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "395883203074"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:395883203074:web:806fcb48ad21b90c88751b
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-9D74JS9VN8
          NEXT_PUBLIC_API_URL: https://inexxio-dev.web.app
          NEXT_PUBLIC_APP_URL: https://inexxio-dev.web.app
          NEXT_PUBLIC_ENVIRONMENT: development
          # Build-Commit: beantwortet bei einer Testnotiz «welchen Stand hast du gesehen?»
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy to Firebase Hosting (dev)
        run: firebase deploy --only hosting --project inexxio-dev --non-interactive

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: failure()
    steps:
      - run: echo "::error::Dev deployment failed for ${{ github.sha }} by ${{ github.actor }}"

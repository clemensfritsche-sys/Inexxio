name: Deploy → Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Die Freigabe zuerst; das Gate läuft danach im Deploy, gleichzeitig mit dem Build – ausgerollt
  # wird nur, wenn es grün ist (deploy.yml).
  approve:
    name: Await production approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - run: echo "Freigegeben – ${{ github.sha }} von ${{ github.actor }}"

  deploy:
    name: Prod
    needs: approve
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      env_name: prod
      gcp_project: inexxio-prod
      service: inexxio-backend-prod
      sql_instance: inexxio-prod-db
      # Die Hauptadresse (seit 22.11.2026 mit Firebase verbunden; www und alle anderen Domains
      # leiten dorthin). Mails, Links, Sitemap und Website-Daten sprechen sie.
      site_url: https://inexxio.com
      # «live» seit 23.11.2026 (Freigabe Heiri Steiner): Suchmaschinen dürfen die Website lesen –
      # ohne noindex, robots.txt offen, Sitemap https://inexxio.com/sitemap.xml (website/START.md).
      site_mode: live
      app_env: production
      # Bis zum Go-live auf null im Leerlauf; danach min 1 (kein Kaltstart, ~7–9 CHF/Monat).
      # Verbindungen: 2 Instanzen × 1 Worker × (5 + 5) = 20 ≤ 25 − 3 – passt auf jede
      # Stufe ab db-f1-micro. Mehr erst, wenn die Datenbank es trägt (db-g1-small: 50).
      min_instances: 0
      max_instances: 2
      cpu: '1'
      # 1 Gi seit 28.11.2026: Alarm «Memory limit of 512 MiB exceeded with 568 MiB used».
      memory: 1Gi
      web_workers: 1
      firebase_project_id: inexxio-prod
      # STRIPE_PUBLISHABLE_KEY kommt auf prod aus dem Secret Manager (Eingabe leer).
      api_rewrite: true
      firebase_api_key: AIzaSyBD1xmJQSGrFQiDdQbND-bg2dxitc7DefQ
      firebase_auth_domain: inexxio-prod.firebaseapp.com
      firebase_storage_bucket: inexxio-prod.firebasestorage.app
      firebase_messaging_sender_id: '203211679913'
      firebase_app_id: 1:203211679913:web:2ac20574d2e320039de1b8
    secrets:
      workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
      service_account: ${{ secrets.WIF_SA_PROD }}

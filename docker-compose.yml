# Nur die Datenbank für die lokale Entwicklung – Backend und Frontend laufen direkt
# (CLAUDE.md, «Lokale Entwicklung»). Dieselbe Hauptversion wie CI und Cloud SQL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inexxio_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

<!-- @dsCard group="ERP / App" viewport="560x300" name="Data List" subtitle="Icon-led rows with status dots — replaces heavy striped tables" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;background:#fff;font-family:var(--font-body);padding:8px 0;}
  .row{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border-1);transition:background .12s;}
  .row:hover{background:var(--bg-2);}
  .row .ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--fg-2);flex:none;}
  .row .ico .lucide{width:16px;height:16px;}
  .row .main{flex:1;min-width:0;}
  .row .t{font:600 14px var(--font-body);color:var(--fg-1);}
  .row .m{font:var(--caption);color:var(--fg-3);margin-top:2px;}
  .row .val{font:600 14px var(--font-body);color:var(--fg-1);font-variant-numeric:tabular-nums;text-align:right;}
  .dot{display:inline-flex;align-items:center;gap:6px;font:var(--caption);color:var(--fg-3);}
  .dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-4);}
  .dot.success::before{background:var(--success);}
  .dot.warning::before{background:var(--warning);}
</style></head>
<body>
  <div class="row"><div class="ico"><i data-lucide="home"></i></div><div class="main"><div class="t">Schlafzimmer Redesign</div><div class="m"><span class="dot success">On Track</span></div></div><div class="val">CHF 12'400</div></div>
  <div class="row"><div class="ico"><i data-lucide="sofa"></i></div><div class="main"><div class="t">Wohnzimmer Konzept</div><div class="m"><span class="dot success">On Track</span></div></div><div class="val">CHF 8'900</div></div>
  <div class="row"><div class="ico"><i data-lucide="utensils"></i></div><div class="main"><div class="t">Küchen Optimierung</div><div class="m"><span class="dot warning">At Risk</span></div></div><div class="val">CHF 15'200</div></div>
  <script>lucide.createIcons();</script>
</body></html>

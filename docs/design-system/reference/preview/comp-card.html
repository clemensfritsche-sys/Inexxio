<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-2);padding:20px;font-family:var(--font-body);}
  .wrap{display:flex;gap:18px;}
  .card{background:#fff;border:1px solid var(--border-1);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);width:300px;}
  .card img{width:100%;height:150px;object-fit:cover;display:block;}
  .bd{padding:16px 18px 20px;}
  .ey{font:var(--overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--inexxio-red);}
  h3{font:700 20px/1.15 var(--font-display);margin:7px 0 8px;color:var(--fg-1);}
  p{font:var(--body-sm);color:var(--fg-2);margin:0;}
  .stat{flex:1;background:var(--bg-dark);border-radius:var(--r-lg);padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:center;}
  .stat .n{font:800 46px/1 var(--font-display);color:var(--inexxio-red-bright);letter-spacing:-.02em;}
  .stat .l{font:var(--body-sm);color:rgba(255,255,255,.7);margin-top:6px;}
</style></head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="../assets/room5.png" alt="">
      <div class="bd">
        <div class="ey">Raumlösung</div>
        <h3>Kleine Wohnungen maximieren</h3>
        <p>Jeder Quadratmillimeter intelligent genutzt – maximaler Wohnkomfort auf kleinstem Raum.</p>
      </div>
    </div>
    <div class="stat">
      <div class="n">70 %</div>
      <div class="l">mehr Stauraum durch smarte Planung</div>
    </div>
  </div>
</body></html>

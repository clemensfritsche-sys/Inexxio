<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .row{display:flex;gap:12px;}
  .sw{flex:1;display:flex;align-items:center;gap:10px;}
  .dot{width:30px;height:30px;border-radius:50%;flex:none;border:1px solid var(--border-1);}
  .name{font:var(--caption);color:var(--fg-1);}
  .hex{font:var(--mono-sm);color:var(--fg-3);text-transform:uppercase;}
  .inks{display:flex;gap:0;margin-bottom:16px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-1);}
  .ink{flex:1;height:56px;display:flex;align-items:center;justify-content:center;font:var(--label);}
</style></head>
<body>
  <div class="inks">
    <div class="ink" style="background:#fff;color:var(--fg-1)">fg-1</div>
    <div class="ink" style="background:#fff;color:var(--fg-2)">fg-2</div>
    <div class="ink" style="background:#fff;color:var(--fg-3)">fg-3</div>
    <div class="ink" style="background:#fff;color:var(--fg-4)">fg-4</div>
    <div class="ink" style="background:var(--bg-dark);color:var(--fg-on-dark)">on-dark</div>
  </div>
  <div class="row" style="margin-bottom:14px;">
    <div class="sw"><span class="dot" style="background:var(--success)"></span><div><div class="name">Success</div><div class="hex">#1F8A4C</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--warning)"></span><div><div class="name">Warning</div><div class="hex">#C8861A</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--info)"></span><div><div class="name">Info</div><div class="hex">#2C6E8F</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--danger)"></span><div><div class="name">Danger</div><div class="hex">#E51A14</div></div></div>
  </div>
  <div class="row">
    <div class="sw"><span class="dot" style="background:var(--accent)"></span><div><div class="name">Accent (slate)</div><div class="hex">#2C6E8F</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--accent-soft)"></span><div><div class="name">Accent soft</div><div class="hex">#E7F0F4</div></div></div>
    <div class="sw"><span class="dot" style="background:var(--accent-ink)"></span><div><div class="name">Accent ink</div><div class="hex">#1C4D66</div></div></div>
    <div class="sw"></div>
  </div>
</body></html>

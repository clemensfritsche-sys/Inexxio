<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Favicon Preview</title>
<style>
  body { margin: 0; background: #F4F2EF; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; gap: 40px; flex-wrap: wrap; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { font-size: 12px; color: #7A7A7F; letter-spacing: 0.05em; text-transform: uppercase; }
  img { image-rendering: crisp-edges; }
  .on-white { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .on-dark { background: #0D0D0F; padding: 20px; border-radius: 12px; }
  .browser-bar { background: #E9E6DF; padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #0A0A0B; }
</style>
</head>
<body>

  <div class="box">
    <div class="label">16px</div>
    <div class="on-white">
      <img src="../../assets/favicon.svg" width="16" height="16">
    </div>
  </div>

  <div class="box">
    <div class="label">32px</div>
    <div class="on-white">
      <img src="../../assets/favicon.svg" width="32" height="32">
    </div>
  </div>

  <div class="box">
    <div class="label">64px</div>
    <div class="on-white">
      <img src="../../assets/favicon.svg" width="64" height="64">
    </div>
  </div>

  <div class="box">
    <div class="label">128px</div>
    <div class="on-white">
      <img src="../../assets/favicon.svg" width="128" height="128">
    </div>
  </div>

  <div class="box">
    <div class="label">On Dark</div>
    <div class="on-dark">
      <img src="../../assets/favicon.svg" width="64" height="64">
    </div>
  </div>

  <div class="box">
    <div class="label">Browser Tab Simulation</div>
    <div class="browser-bar">
      <img src="../../assets/favicon.svg" width="16" height="16">
      <span>INEXXIO — Klein wohnen. Gross leben.</span>
    </div>
  </div>

</body>
</html>

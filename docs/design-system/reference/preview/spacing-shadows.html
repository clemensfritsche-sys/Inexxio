<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-2);padding:26px 20px;font-family:var(--font-body);}
  .row{display:flex;gap:22px;}
  .b{flex:1;text-align:center;}
  .box{background:#fff;height:62px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;}
  .name{font:var(--caption);color:var(--fg-1);margin-top:14px;}
</style></head>
<body>
  <div class="row">
    <div class="b"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="name">xs</div></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="name">sm</div></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="name">md</div></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="name">lg</div></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-red)"></div><div class="name">red glow</div></div>
  </div>
</body></html>

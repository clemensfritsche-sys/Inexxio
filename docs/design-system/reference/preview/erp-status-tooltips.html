<!-- @dsCard group="ERP / App" viewport="720x360" name="Status & Tooltips" subtitle="Dot status for rows · tinted badge with icon for emphasis · icon actions with 300 ms tooltip" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;padding:28px;}.cap{font:500 12px/16px var(--font-body);color:var(--color-text-muted);margin:0 0 12px;}.sec+.sec{margin-top:26px;}.row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;}.row.tight{gap:8px;}.toolbar{display:inline-flex;gap:2px;padding:4px;border:1px solid var(--color-border);border-radius:10px;}</style>
</head><body class="ix-root">
<div class="sec"><p class="cap">Status-Punkt — in Tabellen &amp; Listen (Standard)</p><div class="row">
<span class="ix-status ix-status--success">Im Plan</span><span class="ix-status ix-status--warning">Verzögert</span><span class="ix-status ix-status--danger">Überfällig</span><span class="ix-status ix-status--info">In Prüfung</span><span class="ix-status">Entwurf</span>
</div></div>
<div class="sec"><p class="cap">Badge — nur wenn Hervorhebung nötig ist</p><div class="row tight">
<span class="ix-badge ix-badge--success"><i data-lucide="check"></i>Bezahlt</span><span class="ix-badge ix-badge--warning"><i data-lucide="clock"></i>Fällig in 3 Tagen</span><span class="ix-badge ix-badge--danger"><i data-lucide="alert-triangle"></i>Mahnung</span><span class="ix-badge ix-badge--info"><i data-lucide="info"></i>Neu</span><span class="ix-badge">Archiviert</span>
</div></div>
<div class="sec"><p class="cap">Icon-Aktionen — Hover zeigt Bedeutung</p>
<div class="toolbar">
<button class="ix-btn ix-btn--tertiary ix-btn--icon ix-btn--sm" data-tip="Bearbeiten"><i data-lucide="pencil"></i></button>
<button class="ix-btn ix-btn--tertiary ix-btn--icon ix-btn--sm" data-tip="Duplizieren"><i data-lucide="copy"></i></button>
<button class="ix-btn ix-btn--tertiary ix-btn--icon ix-btn--sm" data-tip="Teilen"><i data-lucide="share-2"></i></button>
<button class="ix-btn ix-btn--tertiary ix-btn--icon ix-btn--sm" data-tip="Archivieren"><i data-lucide="archive"></i></button>
<button class="ix-btn ix-btn--tertiary ix-btn--icon ix-btn--sm" data-tip="Löschen" style="color:var(--color-danger)"><i data-lucide="trash-2"></i></button>
</div></div>
<script>lucide.createIcons();</script>
</body></html>

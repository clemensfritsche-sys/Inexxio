<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .grad{height:64px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--inexxio-red-bright),var(--inexxio-red),var(--inexxio-red-deep));margin-bottom:14px;box-shadow:var(--shadow-red);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;text-align:left;}
  .chip{height:48px;border-radius:var(--r-sm);border:1px solid var(--border-1);}
  .name{font:var(--caption);color:var(--fg-1);margin-top:7px;}
  .hex{font:var(--mono-sm);color:var(--fg-3);text-transform:uppercase;}
</style></head>
<body>
  <div class="grad"></div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FA3030"></div><div class="name">Bright</div><div class="hex">#FA3030</div></div>
    <div class="sw"><div class="chip" style="background:#E51A14"></div><div class="name">Primary</div><div class="hex">#E51A14</div></div>
    <div class="sw"><div class="chip" style="background:#B3120F"></div><div class="name">Deep</div><div class="hex">#B3120F</div></div>
    <div class="sw"><div class="chip" style="background:rgba(229,26,20,0.12)"></div><div class="name">Tint 12%</div><div class="hex">#E51A14</div></div>
  </div>
</body></html>

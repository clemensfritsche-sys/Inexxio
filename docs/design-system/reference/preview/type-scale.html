<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:18px 22px;}
  .r{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-1);padding:7px 0;}
  .r:last-child{border-bottom:0;}
  .tag{font:var(--mono-sm);color:var(--fg-3);width:70px;flex:none;}
  .spec{color:var(--fg-1);}
</style></head>
<body>
  <div class="r"><span class="tag">display</span><span class="spec" style="font:800 38px/1 var(--font-display);letter-spacing:-.02em">Klein wohnen</span></div>
  <div class="r"><span class="tag">h1 / h2</span><span class="spec" style="font:800 28px/1 var(--font-display);letter-spacing:-.02em">Raumlösungen, die begeistern</span></div>
  <div class="r"><span class="tag">h3</span><span class="spec" style="font:700 21px/1 var(--font-display)">Kleine Wohnungen maximieren</span></div>
  <div class="r"><span class="tag">body</span><span class="spec" style="font:400 16px/1 var(--font-body)">Maximale Wohnqualität auf kleinem Raum</span></div>
  <div class="r"><span class="tag">overline</span><span class="spec" style="font:700 12px/1 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--inexxio-red)">INEXXIO in Zahlen</span></div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:22px;font-family:var(--font-body);}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px;}
  li{display:flex;align-items:flex-start;gap:12px;font:var(--body);color:var(--fg-2);}
  .ck{width:24px;height:24px;border-radius:50%;flex:none;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .ck.red{background:rgba(229,26,20,.12);color:var(--inexxio-red);}
  b{color:var(--fg-1);font-weight:700;}
</style></head>
<body>
  <ul>
    <li><span class="ck red">✓</span><span><b>Blitzschnell:</b> Kompletter Raumscan in nur 5–10 Minuten</span></li>
    <li><span class="ck">✓</span><span><b>Millimetergenau:</b> Präzision bis auf 2 mm Genauigkeit</span></li>
    <li><span class="ck">✓</span><span><b>Einfach per Smartphone:</b> Keine zusätzliche Hardware nötig</span></li>
  </ul>
</body></html>

<!-- @dsCard group="Components" viewport="720x380" name="Form fields" subtitle="Default · focus · error · valid · disabled — inline validation with icon" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;padding:28px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;}.foot{display:flex;gap:20px;align-items:center;margin-top:22px;padding-top:20px;border-top:1px solid var(--color-border);}</style>
</head><body class="ix-root">
<div class="grid">
<label class="ix-field"><span class="ix-field__label">Projektname</span><input class="ix-input" placeholder="z. B. Studio Zürich West"></label>
<label class="ix-field"><span class="ix-field__label">Suche</span><span class="ix-input-wrap"><i data-lucide="search"></i><input class="ix-input" placeholder="Kunde, Projekt, Nr."></span></label>
<label class="ix-field is-error"><span class="ix-field__label">E-Mail</span><input class="ix-input" value="anna.mueller@"><span class="ix-field__hint"><i data-lucide="alert-circle"></i>Bitte gültige E-Mail eingeben</span></label>
<label class="ix-field is-valid"><span class="ix-field__label">Fläche <small>m²</small></span><input class="ix-input ix-tnum" value="24.5"><span class="ix-field__hint"><i data-lucide="check"></i>Gespeichert</span></label>
<label class="ix-field"><span class="ix-field__label">Status</span><select class="ix-select"><option>In Planung</option><option>In Produktion</option></select></label>
<label class="ix-field"><span class="ix-field__label">Projekt-ID <small>automatisch</small></span><input class="ix-input" value="PRJ-2026-0142" disabled></label>
</div>
<div class="foot">
<label class="ix-check"><input type="checkbox" checked>Montage inklusive</label>
<label class="ix-check"><input type="checkbox" class="ix-switch" checked>Kunde benachrichtigen</label>
</div>
<script>lucide.createIcons();</script>
</body></html>

<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-1);}
  .chip{height:84px;display:flex;align-items:flex-end;padding:10px;}
  .meta{padding:8px 10px;}
  .name{font:var(--label);color:var(--fg-1);}
  .hex{font:var(--mono-sm);color:var(--fg-3);text-transform:uppercase;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--inexxio-red)"></div><div class="meta"><div class="name">Brand Red</div><div class="hex">#E51A14</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--inexxio-black)"></div><div class="meta"><div class="name">Black</div><div class="hex">#0A0A0B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--inexxio-white);border-bottom:1px solid var(--border-1)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-dark)"></div><div class="meta"><div class="name">Ink (inverse)</div><div class="hex">#141416</div></div></div>
  </div>
</body></html>

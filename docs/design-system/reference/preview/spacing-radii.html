<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:20px;font-family:var(--font-body);}
  .row{display:flex;gap:16px;align-items:flex-end;}
  .b{flex:1;text-align:center;}
  .box{background:var(--bg-3);border:1px solid var(--border-2);height:64px;}
  .name{font:var(--caption);color:var(--fg-1);margin-top:8px;}
  .val{font:var(--mono-sm);color:var(--fg-3);}
</style></head>
<body>
  <div class="row">
    <div class="b"><div class="box" style="border-radius:var(--r-xs)"></div><div class="name">xs</div><div class="val">4px</div></div>
    <div class="b"><div class="box" style="border-radius:var(--r-sm)"></div><div class="name">sm</div><div class="val">8px</div></div>
    <div class="b"><div class="box" style="border-radius:var(--r-md)"></div><div class="name">md</div><div class="val">12px</div></div>
    <div class="b"><div class="box" style="border-radius:var(--r-lg)"></div><div class="name">lg</div><div class="val">20px</div></div>
    <div class="b"><div class="box" style="border-radius:var(--r-xl)"></div><div class="name">xl</div><div class="val">28px</div></div>
    <div class="b"><div class="box" style="border-radius:var(--r-pill)"></div><div class="name">pill</div><div class="val">999px</div></div>
  </div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);display:flex;}
  .light{flex:1;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;}
  .dark{flex:1;background:var(--bg-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;}
  img{width:200px;}
  .tag{font:var(--overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;}
  .light .tag{color:var(--fg-3);}
  .dark .tag{color:rgba(255,255,255,.55);}
  .dark img{filter:brightness(0) invert(1);}
</style></head>
<body>
  <div class="light"><img src="../assets/logo.png" alt="INEXXIO"><span class="tag">On white</span></div>
  <div class="dark"><img src="../assets/logo.png" alt="INEXXIO"><span class="tag">Reversed (white-out)</span></div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-2);padding:26px 28px;font-family:var(--font-body);}
  .ey{font:var(--overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--inexxio-red);margin-bottom:12px;}
  h2{font:800 44px/1.0 var(--font-display);letter-spacing:-.04em;color:var(--fg-1);margin:0;}
  .swoosh{display:inline-block;position:relative;}
  .swoosh::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-6px;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--inexxio-red-bright),var(--inexxio-red-deep));}
  .sub{font:var(--body-lg);color:var(--fg-3);margin-top:14px;max-width:520px;}
</style></head>
<body>
  <div class="ey">Headline pattern</div>
  <h2>Klein wohnen.<br><span class="swoosh"><span class="ix-mark">Gross</span></span> leben.</h2>
  <div class="sub">Eyebrow in red · big display headline with one accent word and the swoosh underline · soft grey subline.</div>
</body></html>

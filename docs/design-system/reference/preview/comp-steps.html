<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;padding:20px;font-family:var(--font-body);}
  .step{display:flex;align-items:center;gap:18px;}
  .badge{width:56px;height:56px;flex:none;border-radius:50%;background:var(--inexxio-red);color:#fff;display:flex;align-items:center;justify-content:center;font:800 26px var(--font-display);box-shadow:var(--shadow-sm);}
  .txt h4{margin:0 0 3px;font:700 19px var(--font-display);color:var(--fg-1);}
  .txt p{margin:0;font:var(--body-sm);color:var(--fg-3);}
  .conn{height:2px;background:repeating-linear-gradient(90deg,var(--border-2) 0 8px,transparent 8px 16px);margin:18px 0 18px 27px;}
  .num{width:40px;height:40px;border-radius:50%;border:2px solid var(--inexxio-black);display:flex;align-items:center;justify-content:center;font:800 18px var(--font-display);color:var(--fg-1);}
</style></head>
<body>
  <div class="step">
    <div class="badge">1</div>
    <div class="txt"><h4>Raumdaten erfassen</h4><p>3D-Scan per Smartphone · 5–10 Min · 2 mm genau</p></div>
  </div>
  <div class="conn"></div>
  <div class="step">
    <div class="num">2</div>
    <div class="txt"><h4>Individuelles Designkonzept</h4><p>Fotorealistisches 3D-Konzept in 48–72 Stunden</p></div>
  </div>
</body></html>

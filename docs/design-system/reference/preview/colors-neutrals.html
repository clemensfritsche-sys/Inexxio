<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;}
  .chip{height:62px;border-radius:var(--r-sm);border:1px solid var(--border-1);}
  .name{font:var(--caption);color:var(--fg-1);margin-top:7px;}
  .hex{font:var(--mono-sm);color:var(--fg-3);text-transform:uppercase;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--sand-50)"></div><div class="name">Sand 50</div><div class="hex">#FBF9F6</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-2)"></div><div class="name">Off-white</div><div class="hex">#F7F5F2</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-3)"></div><div class="name">Sand</div><div class="hex">#EFEBE5</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-300)"></div><div class="name">Sand 300</div><div class="hex">#DACFC0</div></div>
    <div class="sw"><div class="chip" style="background:var(--oak)"></div><div class="name">Oak</div><div class="hex">#C9A27A</div></div>
    <div class="sw"><div class="chip" style="background:var(--stone)"></div><div class="name">Stone</div><div class="hex">#9AA0A0</div></div>
  </div>
</body></html>
